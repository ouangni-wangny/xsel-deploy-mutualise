# USAGE AVANCÉ — avec le pipeline (cicd.yml), la surveillance est incluse (cron,
# URLs = health_check_url du manifeste, certificats TLS). Ce fichier ne sert
# qu'aux projets qui utilisent les workflows individuels.
#
# Exemple : .github/workflows/monitor.yml dans un projet consommateur
# (copier-adapter). Tourne indépendamment des déploiements — GitHub
# envoie un email au propriétaire du repo si ce workflow échoue, aucune
# intégration Slack/autre nécessaire pour démarrer.

name: Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/monitor.yml@v1
    with:
      urls: |
        https://api.example.com/up
        https://example.com
