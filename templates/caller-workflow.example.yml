# USAGE AVANCÉ — workflow individuel deploy.yml. Pour un nouveau projet, préférez
# le pipeline : templates/cicd-caller.example.yml + templates/xsel-deploy.example.yml
# (CI, déploiement, diagnostic, provisioning, surveillance et conformité inclus).
#
# Trois exemples de .github/workflows/deploy.yml dans un projet consommateur
# (copier-adapter). Le projet porte aussi sa propre CI de tests (ci.yml). Entrées :
# celles de .github/workflows/deploy.yml du kit ; secrets : SSH_HOST, SSH_PORT,
# SSH_USER, SSH_PRIVATE_KEY.

# =============================================================================
# Cas 1 — Repo dédié à une seule app (multi-repo : le plus simple)
# app_path est omis (défaut ".") : le repo entier EST l'app.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1
    with:
      # stack, php_version, php_bin, extensions PHP, Node : détectés
      # automatiquement (surchargeables — voir la référence des inputs).
      deploy_path: /home/UTILISATEUR/api.example.com
      health_check_url: https://api.example.com/up
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

---
# =============================================================================
# Cas 2 — Monorepo, app backend (.github/workflows/deploy-backend.yml)
# app_path pointe vers le sous-dossier ; paths: limite le déclenchement.
# =============================================================================

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-backend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1
    with:
      stack: laravel
      app_path: backend
      deploy_path: /home/UTILISATEUR/example.com/api
      health_check_url: https://api.example.com/up
      # CloudLinux uniquement (voir README) : chemins réels si /usr/bin/php
      # et 'composer' ne correspondent pas à la version voulue.
      # php_bin: /opt/alt/php83/usr/bin/php
      # composer_bin: /opt/alt/php83/usr/bin/composer
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

---
# =============================================================================
# Cas 3 — Monorepo, app frontend (même projet que le cas 2, deuxième app)
# protect_paths évite qu'un sous-domaine imbriqué (api.example.com vivant
# dans example.com/api, chemin standard cPanel) soit effacé par le
# déploiement de ce frontend. (Le pipeline le fait automatiquement ; ici,
# avec des workflows séparés, il faut le déclarer.)
# =============================================================================

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1
    with:
      stack: nextjs-passenger
      app_path: frontend
      deploy_path: /home/UTILISATEUR/example.com
      health_check_url: https://example.com
      protect_paths: |
        api
      # Toute variable NEXT_PUBLIC_* lue côté client doit être ici, sinon
      # elle vaudra undefined dans le bundle buildé (jamais relue au
      # runtime via cPanel) :
      build_env: |
        NEXT_PUBLIC_API_URL=https://api.example.com/api/v1
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
