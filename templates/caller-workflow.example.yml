# Trois exemples de .github/workflows/deploy.yml dans un projet consommateur
# (copier-adapter — c'est la SEULE chose qu'un projet doit porter en plus de
# ses secrets GitHub et de sa propre CI de tests, voir ADR-0004 et ADR-0005).
# Référence complète des inputs/secrets dans le README de ce repo.

# =============================================================================
# Cas 1 — Repo dédié à une seule app (multi-repo : le plus simple)
# app_path est omis (défaut ".") : le repo entier EST l'app.
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.0.1
    with:
      stack: laravel
      deploy_path: /home/xselcpaneluser/api.exemple.com
      health_check_url: https://api.exemple.com/up
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

---
# =============================================================================
# Cas 2 — Monorepo, app backend (ex. PECI : .github/workflows/deploy-backend.yml)
# app_path pointe vers le sous-dossier ; paths: limite le déclenchement.
# =============================================================================

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-backend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.0.1
    with:
      stack: laravel
      app_path: backend
      deploy_path: /home/xselcpaneluser/api.peci.org
      health_check_url: https://api.peci.org/up
      # CloudLinux uniquement (voir README) : chemins réels si /usr/bin/php
      # et 'composer' ne correspondent pas à la version voulue.
      # php_bin: /opt/alt/php83/usr/bin/php
      # composer_bin: /opt/alt/php83/usr/bin/composer
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

---
# =============================================================================
# Cas 3 — Monorepo, app frontend (même projet que le cas 2, deuxième app)
# protect_paths évite qu'un sous-domaine imbriqué (backend.peci.org vivant
# dans peci.org/backend, chemin standard cPanel) soit effacé par le
# déploiement de ce frontend — voir README, section "Organiser un projet".
# =============================================================================

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  ci:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: ci
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/deploy.yml@v1.0.1
    with:
      stack: nextjs-passenger
      app_path: frontend
      deploy_path: /home/xselcpaneluser/peci.org
      health_check_url: https://peci.org
      protect_paths: |
        backend
      # Toute variable NEXT_PUBLIC_* lue côté client doit être ici, sinon
      # elle vaudra undefined dans le bundle buildé (jamais relue au
      # runtime via cPanel) :
      build_env: |
        NEXT_PUBLIC_API_URL=https://api.peci.org
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
