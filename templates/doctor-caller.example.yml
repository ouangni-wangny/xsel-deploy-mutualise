# USAGE AVANCÉ — avec le pipeline (cicd.yml), le diagnostic est déjà disponible :
# Actions → CI/CD → Run workflow → action: doctor. Ce fichier ne sert qu'aux projets
# qui utilisent les workflows individuels.
#
# À copier dans le projet : .github/workflows/doctor.yml
# Lancement manuel (onglet Actions → Doctor → Run workflow). Ne déploie rien.
name: Doctor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/doctor.yml@v1
    with:
      app_path: backend
      deploy_path: /home/UTILISATEUR/example.com/api
      health_check_url: https://api.example.com/up
    secrets:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
