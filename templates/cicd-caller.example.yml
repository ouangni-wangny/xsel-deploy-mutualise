# À copier tel quel dans le projet : .github/workflows/cicd.yml
# C'est le SEUL workflow que porte un projet (avec le manifeste .xsel-deploy.yml).
# Le kit décide quoi lancer selon l'événement et les fichiers modifiés :
#   pull_request / push        -> CI des apps concernées
#   push sur la branche de déploiement -> puis déploiement (une app à la fois)
#   lancement manuel           -> déploiement, diagnostic serveur (action: doctor) ou
#                                 préparation d'une app fraîche (action: provision)
#   cron                       -> monitoring des URLs
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire ?"
        type: choice
        options: [deploy, doctor, provision]
        default: deploy
      apps:
        description: "Apps concernées (noms séparés par des virgules ; vide = toutes)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  pipeline:
    # @v1 : tag flottant (dernière version 1.x.y qui a passé les tests du kit).
    # Pour figer : @v1.7.0 (ou un SHA de commit).
    uses: ouangni-wangny/xsel-deploy-mutualise/.github/workflows/pipeline.yml@v1
    # Secrets passés un par un : « secrets: inherit » ne transmet rien à un
    # workflow réutilisable d'un autre propriétaire (le kit est chez ouangni-wangny).
    secrets:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
