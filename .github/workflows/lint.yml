name: Lint

# Valide ce repo lui-même (pas un projet consommateur) : erreurs de schéma
# GitHub Actions (ex. input retiré mais encore référencé quelque part) et
# bugs shell dans les scripts serveur — avant qu'un push ici ne casse le
# déploiement de tous les projets qui utilisent ce kit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh

  # Tests des scripts serveur et des actions (faux uapi/selectorctl/mysqldump,
  # serveur PHP local) : tests/run.sh, bash pur, aucune dépendance.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Suite de tests
        run: bash tests/run.sh
