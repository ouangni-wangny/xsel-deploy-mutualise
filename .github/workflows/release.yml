name: Release

# Sur un tag vX.Y.Z : exécute la suite de tests, crée la GitHub Release (notes
# générées) puis déplace le tag flottant de la version majeure (vX) sur ce
# commit. Les projets qui utilisent `@v1` reçoivent ainsi les correctifs sans
# toucher à leurs workflows — mais SEULEMENT si les tests passent : un tag qui
# échoue ne déplace jamais `vX`. Les tags vX.Y.Z restent immuables. ADR-0010.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Suite de tests
        run: bash tests/run.sh

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

      - name: Déplacer le tag flottant de la version majeure
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/${MAJOR}"
          echo "✅ ${MAJOR} → ${TAG} (${GITHUB_SHA})"
