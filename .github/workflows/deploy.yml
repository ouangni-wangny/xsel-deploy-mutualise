name: Deploy (mutualisé)

# Workflow réutilisable — voir ADR-0004. Ne pas dupliquer dans les projets
# consommateurs : ils l'appellent via `uses:` (voir
# templates/caller-workflow.example.yml). Déploiement direct, sans
# releases/symlink — voir ADR-0002.

on:
  workflow_call:
    inputs:
      stack:
        description: "'laravel' ou 'nextjs-passenger'"
        required: true
        type: string
      app_path:
        description: "Sous-dossier du repo appelant contenant cette app (ex. 'backend')"
        required: false
        type: string
        default: "."
      deploy_path:
        description: "Chemin absolu sur le serveur où le code est déployé directement"
        required: true
        type: string
      php_version:
        required: false
        type: string
        default: "8.3"
      node_version:
        required: false
        type: string
        default: "20"
      health_check_url:
        description: "URL publique à vérifier après déploiement (ex. https://api.peci.org/up) — optionnel mais recommandé"
        required: false
        type: string
        default: ""
      build_frontend_assets:
        description: "Stack laravel uniquement : lancer 'npm run build' (Vite) avant déploiement"
        required: false
        type: boolean
        default: true
      php_bin:
        description: "Stack laravel : chemin du binaire PHP côté serveur (utile sur CloudLinux où /usr/bin/php ne correspond pas à la version sélectionnée, ex. /opt/alt/php83/usr/bin/php)"
        required: false
        type: string
        default: "php"
      composer_bin:
        description: "Stack laravel : chemin du binaire composer côté serveur (voir php_bin)"
        required: false
        type: string
        default: "composer"
      composer_on_server:
        description: >
          Stack laravel — false (défaut, recommandé) : `composer install
          --no-dev` tourne sur le runner et `vendor/` est livré avec le code
          (build once, deploy) ; le serveur n'a besoin ni de composer ni de
          réseau vers Packagist. true : ancien comportement, composer sur le
          serveur (composer_bin, ou repli sur le composer.phar du runner).
        required: false
        type: boolean
        default: false
      manage_web_php:
        description: >
          Stack laravel — true (défaut) : aligne la version PHP du domaine
          (cPanel MultiPHP, via uapi) sur php_bin avant le déploiement ; le
          PHP CLI et le PHP web sont deux réglages distincts et un décalage
          donne un HTTP 500 après un déploiement pourtant « réussi ». Ne fait
          rien hors cPanel ou sans health_check_url. false = ne jamais y toucher.
        required: false
        type: boolean
        default: true
      php_extensions:
        description: >
          Stack laravel — extensions PHP supplémentaires à exiger/activer sur
          le serveur, séparées par des virgules (ex. "intl,gd"), en plus de
          celles déduites de composer.json/composer.lock (ext-*).
        required: false
        type: string
        default: ""
      build_env:
        description: >
          Variables exposées pendant le build (une par ligne, KEY=VALUE) —
          pour Next.js, tout NEXT_PUBLIC_* doit être fourni ici : ces
          variables sont figées dans le bundle au build, jamais relues au
          runtime (inutile de les définir seulement dans cPanel Setup
          Node.js App). Non secrètes par nature (exposées côté client) —
          si une valeur est sensible, passer par `secrets` et ne pas
          l'utiliser dans une variable NEXT_PUBLIC_*.
        required: false
        type: string
        default: ""
      protect_paths:
        description: >
          Chemins relatifs à deploy_path à protéger de la suppression par
          `rsync --delete` (un par ligne) — nécessaire quand le deploy_path
          d'une autre app est un sous-dossier de celui-ci (cas standard
          cPanel : un sous-domaine backend.example.com vit physiquement
          dans example.com/backend). Sans ça, --delete effacerait ce
          sous-dossier au déploiement de l'app parente.
        required: false
        type: string
        default: ""
    secrets:
      SSH_HOST:
        required: true
      SSH_PORT:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    name: Build & deploy (${{ inputs.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deux déploiements simultanés vers le même deploy_path (ex. un push et
    # un workflow_dispatch qui se chevauchent) pourraient interleaver leurs
    # rsync/artisan sur le serveur. Un déploiement en attend un autre plutôt
    # que de les annuler (cancel-in-progress: false) pour ne jamais couper
    # un rsync en plein milieu.
    concurrency:
      group: deploy-${{ inputs.deploy_path }}
      cancel-in-progress: false
    steps:
      - name: Valider la stack demandée
        run: |
          case "${{ inputs.stack }}" in
            laravel|nextjs-passenger) ;;
            *) echo "::error::stack invalide : '${{ inputs.stack }}' (attendu: laravel | nextjs-passenger)"; exit 1 ;;
          esac

      - name: Checkout du projet appelant
        uses: actions/checkout@v4
        with:
          path: app

      # Limite connue : GitHub n'expose pas de façon fiable, depuis l'intérieur
      # d'un workflow réutilisable, le ref exact avec lequel il a été appelé
      # (@main vs @v1.2.0). Les scripts serveur sont donc toujours pris sur
      # `main`, même si le projet appelant épingle ce workflow sur un tag —
      # voir ADR-0004. À revisiter si ça devient un problème en pratique
      # (ex. en dupliquant le ref en input explicite `kit_ref`).
      - name: Checkout xsel-deploy-mutualise (scripts serveur, toujours main)
        uses: actions/checkout@v4
        with:
          repository: ouangni-wangny/xsel-deploy-mutualise
          ref: main
          path: deploy-kit

      - name: Exposer build_env aux étapes de build suivantes
        if: inputs.build_env != ''
        run: echo "${{ inputs.build_env }}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # Build — Laravel
      # ---------------------------------------------------------------------
      # Extensions PHP requises (require de composer.json + des paquets du
      # lock, hors require-dev) : servent à équiper le PHP du runner ET à
      # vérifier/activer le PHP du serveur (préflight) — même source de vérité.
      - name: Déterminer les extensions PHP requises
        if: inputs.stack == 'laravel'
        working-directory: app/${{ inputs.app_path }}
        env:
          EXTRA_EXTS: ${{ inputs.php_extensions }}
        run: |
          EXTS="$(
            {
              jq -r '(.require // {}) | keys[]' composer.json 2>/dev/null
              jq -r '(.packages // [])[] | (.require // {}) | keys[]' composer.lock 2>/dev/null
              printf '%s\n' "$EXTRA_EXTS" | tr ',' '\n' | sed 's/^ *//;s/ *$//;s/^/ext-/'
            } | grep '^ext-' | sed 's/^ext-//' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | sort -u | tr '\n' ' '
          )"
          echo "extensions requises : ${EXTS:-aucune}"
          echo "REQUIRED_EXTS=${EXTS% }" >> "$GITHUB_ENV"
          echo "REQUIRED_EXTS_CSV=$(printf '%s' "${EXTS% }" | tr ' ' ',')" >> "$GITHUB_ENV"

      - name: Setup PHP
        if: inputs.stack == 'laravel'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ env.REQUIRED_EXTS_CSV }}
          tools: composer:v2
          coverage: none

      - name: Setup Node (build assets Laravel)
        if: inputs.stack == 'laravel' && inputs.build_frontend_assets
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app/${{ inputs.app_path }}/package-lock.json

      - name: npm ci && npm run build (assets Vite)
        if: inputs.stack == 'laravel' && inputs.build_frontend_assets
        working-directory: app/${{ inputs.app_path }}
        run: |
          npm ci
          npm run build

      # --no-scripts : pas de artisan au build (pas de .env en CI) ; le serveur
      # rejoue package:discover (deploy-laravel.sh). Pas de --classmap-authoritative
      # pour rester identique au comportement historique (--optimize-autoloader).
      - name: Installer les dépendances PHP (artefact de build)
        if: inputs.stack == 'laravel' && !inputs.composer_on_server
        working-directory: app/${{ inputs.app_path }}
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts --no-interaction --no-progress

      - name: Préparer le paquet à déployer (Laravel)
        if: inputs.stack == 'laravel'
        run: |
          mkdir -p /tmp/release
          EXCL=(--exclude='.git' --exclude='.env' --exclude='.env.*'
                --exclude='storage' --exclude='node_modules' --exclude='tests')
          # vendor/ est livré tel quel (artefact CI) sauf mode composer_on_server.
          if [ "${{ inputs.composer_on_server }}" = "true" ]; then
            EXCL+=(--exclude='vendor')
          fi
          rsync -a "${EXCL[@]}" "app/${{ inputs.app_path }}/" /tmp/release/

      # ---------------------------------------------------------------------
      # Build — Next.js (Passenger)
      # ---------------------------------------------------------------------
      - name: Setup Node
        if: inputs.stack == 'nextjs-passenger'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: app/${{ inputs.app_path }}/package-lock.json

      - name: npm ci && npm run build
        if: inputs.stack == 'nextjs-passenger'
        working-directory: app/${{ inputs.app_path }}
        run: |
          npm ci
          npm run build

      - name: Préparer le paquet à déployer (Next.js standalone)
        if: inputs.stack == 'nextjs-passenger'
        run: |
          APP="app/${{ inputs.app_path }}"
          [ -f "$APP/.next/standalone/server.js" ] || {
            echo "::error::.next/standalone/server.js introuvable — ajoutez output: 'standalone' dans next.config (voir ADR-0003)."
            exit 1
          }
          mkdir -p /tmp/release
          rsync -a "$APP/.next/standalone/" /tmp/release/
          mkdir -p /tmp/release/.next
          rsync -a "$APP/.next/static/" /tmp/release/.next/static/
          if [ -d "$APP/public" ]; then
            rsync -a "$APP/public/" /tmp/release/public/
          fi

      # ---------------------------------------------------------------------
      # Transport SSH (ADR-0001) + déploiement direct (ADR-0002)
      # ---------------------------------------------------------------------
      - name: Configurer la clé SSH
        # Nombre de connexions SSH volontairement minimal (ADR-0006) : de
        # nombreux hébergeurs (pare-feu CSF/LFD, fail2ban, limites par IP…)
        # ignorent silencieusement — timeout, pas de refus — les nouvelles
        # connexions d'une IP au-delà d'un petit seuil. Avant : keyscan (une
        # connexion par type de clé) + mkdir + préflight + 2 rsync + finalize
        # = ~8 connexions, la 4e-5e était coupée. Maintenant : 1 keyscan +
        # 1 connexion maître (ControlMaster) réutilisée par toutes les étapes.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -uo pipefail
          umask 077
          mkdir -p ~/.ssh/cm
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Host key : un seul type (donc une seule connexion) ; le client
          # ssh choisit l'algorithme présent dans known_hosts. Repli sur le
          # type suivant seulement si le serveur n'expose pas le précédent.
          KEYS="$(mktemp)"
          for t in ed25519 ecdsa rsa; do
            ssh-keyscan -T 15 -t "$t" -p "$SSH_PORT" -H "$SSH_HOST" > "$KEYS" 2>/dev/null || true
            [ -s "$KEYS" ] && break
          done
          if [ ! -s "$KEYS" ]; then
            echo "::error::host key introuvable sur ${SSH_HOST}:${SSH_PORT} — serveur injoignable, SSH_HOST/SSH_PORT erronés, ou connexions limitées par un pare-feu (IP du runner bloquée)"
            exit 1
          fi
          cat "$KEYS" >> ~/.ssh/known_hosts

          # Toutes les étapes suivantes (ssh ET rsync -e ssh) réutilisent la
          # même connexion TCP. Un master perdu est recréé automatiquement.
          cat >> ~/.ssh/config <<EOF
          Host $SSH_HOST
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ControlMaster auto
            ControlPath $HOME/.ssh/cm/%C
            ControlPersist 30m
          EOF

          # Connexion maître, avec retry/backoff pour les blocages temporaires.
          # Un refus d'authentification n'est pas retenté (inutile et lent).
          for i in 1 2 3 4; do
            OUT="$(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" true 2>&1)" && { echo "connexion SSH établie (essai $i)"; exit 0; }
            echo "$OUT"
            case "$OUT" in *"Permission denied"*|*"Host key verification failed"*) break ;; esac
            [ "$i" -lt 4 ] && { echo "::warning::connexion SSH échouée (essai $i/4), nouvel essai dans $((i * 20))s"; sleep $((i * 20)); }
          done
          echo "::error::impossible d'ouvrir la connexion SSH vers ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          exit 1

      - name: Créer les dossiers de destination sur le serveur
        # `rsync --mkpath` n'existe que depuis rsync 3.2.3 — beaucoup
        # d'hébergements mutualisés tournent encore une version plus
        # ancienne (ex. 3.1.3), qui rejette l'option et casse le flux
        # protocole rsync (exit code 12). On crée les dossiers nous-mêmes.
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ inputs.deploy_path }}' '${{ inputs.deploy_path }}/.deploy-scripts'"

      - name: Préflight — vérifier le serveur avant de déployer
        # Échoue vite et avec un message clair plutôt qu'au milieu du
        # transfert/déploiement (cas vécus : rsync trop ancien pour une
        # option utilisée, php_bin/composer_bin introuvables au chemin
        # configuré, plus de place disque).
        run: |
          SCRIPT="command -v rsync >/dev/null || { echo '::error::rsync introuvable sur le serveur'; exit 1; }
          echo \"rsync (serveur) : \$(rsync --version | head -1)\""

          if [ "${{ inputs.stack }}" = "laravel" ]; then
            # Si un chemin est faux, on liste ce qui existe réellement sur le
            # serveur : évite un aller-retour manuel en SSH pour le trouver.
            read -r -d '' DIAG <<'EOS' || true
          diag_bins() {
            echo "binaires trouvés sur le serveur :"
            for c in $(command -v php composer 2>/dev/null) /opt/alt/php*/usr/bin/php /opt/alt/php*/usr/bin/composer \
                     /opt/cpanel/ea-php*/root/usr/bin/php /opt/cpanel/composer/bin/composer /usr/local/bin/composer \
                     "$HOME/bin/composer" "$HOME/.local/bin/composer"; do
              [ -x "$c" ] && echo "  - $c"
            done
          }
          EOS
            SCRIPT="$SCRIPT
          $DIAG
          command -v '${{ inputs.php_bin }}' >/dev/null || { echo \"::error::php_bin introuvable : ${{ inputs.php_bin }}\"; diag_bins; exit 1; }
          echo \"php_bin : \$('${{ inputs.php_bin }}' -v | head -1)\""
            if [ "${{ inputs.composer_on_server }}" = "true" ]; then
              SCRIPT="$SCRIPT
          command -v '${{ inputs.composer_bin }}' >/dev/null || echo COMPOSER_FALLBACK=1"
            fi
          fi

          SCRIPT="$SCRIPT
          FREE_MB=\$(df -Pm '${{ inputs.deploy_path }}' 2>/dev/null | tail -1 | awk '{print \$4}')
          echo \"espace disque libre : \${FREE_MB:-?} Mo\"
          [ -n \"\$FREE_MB\" ] && [ \"\$FREE_MB\" -lt 100 ] && { echo '::error::moins de 100 Mo disponibles sur le serveur'; exit 1; }
          exit 0"

          set -o pipefail
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "$SCRIPT" | tee /tmp/preflight.out

          # composer absent du serveur (fréquent en mutualisé) : ce n'est pas
          # bloquant, le workflow enverra le composer du runner (voir plus bas).
          if grep -q '^COMPOSER_FALLBACK=1' /tmp/preflight.out; then
            echo "::warning::composer_bin introuvable côté serveur (${{ inputs.composer_bin }}) — le composer du runner sera envoyé et exécuté avec php_bin"
            echo "COMPOSER_FALLBACK=1" >> "$GITHUB_ENV"
          fi

      - name: Vérifier et activer les extensions PHP du serveur
        # Échoue tôt (avant tout transfert) si une extension exigée par
        # composer.lock manque ; tente d'abord de l'activer via CloudLinux
        # PHP Selector (selectorctl) plutôt que de demander un clic manuel.
        if: inputs.stack == 'laravel'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "PHP_BIN='${{ inputs.php_bin }}' REQUIRED_EXTS='${REQUIRED_EXTS:-}' bash -s" \
            < deploy-kit/scripts/ensure-php-extensions.sh

      - name: Déployer le code sur le serveur (écrase en place)
        # --delete réactivé, mais avec des exclusions protégées : sans ça,
        # un fichier retiré du repo resterait indéfiniment sur le serveur.
        # .deploy-scripts/.backups sont toujours protégés ; protect_paths
        # ajoute les cas projet (ex. sous-dossier d'une autre app imbriquée).
        run: |
          EXCLUDES=(--exclude=.deploy-scripts --exclude=.backups)
          if [ "${{ inputs.stack }}" = "laravel" ]; then
            EXCLUDES+=(--exclude=.env --exclude=storage)
          fi
          if [ "${{ inputs.stack }}" = "nextjs-passenger" ]; then
            # cPanel "Setup Node.js App" génère son propre .htaccess (routage
            # Passenger) au moment où l'app est créée — ni suivi en git, ni
            # reproductible depuis le repo. --delete l'effacerait sinon à
            # chaque déploiement (incident vécu sur PECI). tmp/ protégé pour
            # la même raison (état géré par Passenger, pas par le déploiement).
            EXCLUDES+=(--exclude=.htaccess --exclude=tmp)
          fi
          while IFS= read -r p; do
            [ -n "$p" ] && EXCLUDES+=(--exclude="$p")
          done <<< "${{ inputs.protect_paths }}"

          rsync -az --delete "${EXCLUDES[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            /tmp/release/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ inputs.deploy_path }}/"

      - name: Envoyer les scripts de déploiement (toujours à jour, ADR-0004)
        run: |
          if [ "${COMPOSER_FALLBACK:-}" = "1" ]; then
            COMPOSER_LOCAL="$(command -v composer || true)"
            if [ -z "$COMPOSER_LOCAL" ] || ! php "$COMPOSER_LOCAL" --version >/dev/null 2>&1; then
              echo "::error::composer absent du serveur ET du runner — renseignez composer_bin avec un chemin valide"
              exit 1
            fi
            cp "$COMPOSER_LOCAL" deploy-kit/scripts/composer.phar
            echo "composer du runner joint aux scripts : $(php "$COMPOSER_LOCAL" --version 2>/dev/null | head -1)"
          fi
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            deploy-kit/scripts/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ inputs.deploy_path }}/.deploy-scripts/"

      - name: Aligner la version PHP du serveur web (MultiPHP, après le transfert)
        if: inputs.stack == 'laravel' && inputs.manage_web_php && inputs.health_check_url != ''
        env:
          HEALTH_URL: ${{ inputs.health_check_url }}
        run: |
          DOMAIN="${HEALTH_URL#*://}"
          DOMAIN="${DOMAIN%%[/:?]*}"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "PHP_BIN='${{ inputs.php_bin }}' DOMAIN='${DOMAIN}' bash -s" \
            < deploy-kit/scripts/ensure-web-php.sh

      - name: Finaliser le déploiement (install/migrate ou restart + healthcheck)
        run: |
          SCRIPT="deploy-laravel.sh"
          [ "${{ inputs.stack }}" = "nextjs-passenger" ] && SCRIPT="deploy-nextjs-passenger.sh"

          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='${{ inputs.deploy_path }}' HEALTH_CHECK_URL='${{ inputs.health_check_url }}' PHP_BIN='${{ inputs.php_bin }}' COMPOSER_BIN='${{ inputs.composer_bin }}' COMPOSER_ON_SERVER='${{ inputs.composer_on_server }}' bash '${{ inputs.deploy_path }}/.deploy-scripts/${SCRIPT}'"

      - name: Fermer la connexion SSH partagée
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -O exit -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 2>/dev/null || true
