name: Deploy (mutualisé)

# Workflow réutilisable — déploie UNE application (voir ADR-0004, ADR-0010).
# Couche fine : la logique vit dans l'action composite deploy-app (partagée avec
# pipeline.yml). Pour un projet, préférer pipeline.yml + manifeste
# .xsel-deploy.yml (un seul fichier d'appel). Déploiement direct, sans
# releases/symlink — voir ADR-0002.

on:
  workflow_call:
    inputs:
      stack:
        description: >
          'auto' (défaut : détecté — laravel/framework dans composer.json,
          next dans package.json), 'laravel' ou 'nextjs-passenger'
        required: false
        type: string
        default: "auto"
      app_path:
        description: "Sous-dossier du repo appelant contenant cette app (ex. 'backend')"
        required: false
        type: string
        default: "."
      deploy_path:
        description: "Chemin absolu sur le serveur où le code est déployé directement"
        required: true
        type: string
      php_version:
        description: >
          Stack laravel — version de PHP (ex. "8.4") pour le build ET le
          serveur. Vide (défaut) : déduite (PHP cPanel du domaine, sinon la plus
          basse version installée qui satisfait composer.json).
        required: false
        type: string
        default: ""
      node_version:
        description: >
          Stack nextjs-passenger — version majeure de Node. Vide (défaut) :
          .nvmrc / .node-version / engines.node, sinon 22.
        required: false
        type: string
        default: ""
      health_check_url:
        description: "URL publique à vérifier après déploiement (ex. https://api.peci.org/up) — optionnel mais recommandé"
        required: false
        type: string
        default: ""
      build_frontend_assets:
        description: "Stack laravel uniquement : lancer 'npm run build' (Vite) avant déploiement"
        required: false
        type: boolean
        default: true
      php_bin:
        description: >
          Stack laravel — binaire PHP CLI côté serveur. "auto" (défaut) :
          résolu sur le serveur (alt-php CloudLinux, ea-php cPanel, php du
          PATH) d'après php_version / le PHP cPanel du domaine / composer.json.
          À n'imposer (ex. /opt/alt/php84/usr/bin/php) qu'en cas d'ambiguïté.
        required: false
        type: string
        default: "auto"
      composer_bin:
        description: "Stack laravel : chemin du binaire composer côté serveur (voir php_bin)"
        required: false
        type: string
        default: "composer"
      composer_on_server:
        description: >
          Stack laravel — false (défaut, recommandé) : `composer install
          --no-dev` tourne sur le runner et `vendor/` est livré avec le code
          (build once, deploy) ; le serveur n'a besoin ni de composer ni de
          réseau vers Packagist. true : ancien comportement, composer sur le
          serveur (composer_bin, ou repli sur le composer.phar du runner).
        required: false
        type: boolean
        default: false
      environment:
        description: >
          Nom de l'Environment GitHub du job de déploiement (défaut
          "production"). C'est là qu'on configure, côté dépôt (Settings →
          Environments), l'approbation manuelle avant déploiement et la
          restriction des branches. Sans règle configurée, le déploiement
          part comme avant.
        required: false
        type: string
        default: "production"
      manage_web_php:
        description: >
          Stack laravel — true (défaut) : aligne la version PHP du domaine
          (cPanel MultiPHP, via uapi) sur php_bin avant le déploiement ; le
          PHP CLI et le PHP web sont deux réglages distincts et un décalage
          donne un HTTP 500 après un déploiement pourtant « réussi ». Ne fait
          rien hors cPanel ou sans health_check_url. false = ne jamais y toucher.
        required: false
        type: boolean
        default: true
      php_extensions:
        description: >
          Stack laravel — extensions PHP supplémentaires à exiger/activer sur
          le serveur, séparées par des virgules (ex. "intl,gd"), en plus de
          celles déduites de composer.json/composer.lock (ext-*).
        required: false
        type: string
        default: ""
      build_env:
        description: >
          Variables exposées pendant le build (une par ligne, KEY=VALUE) —
          pour Next.js, tout NEXT_PUBLIC_* doit être fourni ici : ces
          variables sont figées dans le bundle au build, jamais relues au
          runtime (inutile de les définir seulement dans cPanel Setup
          Node.js App). Non secrètes par nature (exposées côté client) —
          si une valeur est sensible, passer par `secrets` et ne pas
          l'utiliser dans une variable NEXT_PUBLIC_*.
        required: false
        type: string
        default: ""
      protect_paths:
        description: >
          Chemins relatifs à deploy_path à protéger de la suppression par
          `rsync --delete` (un par ligne) — nécessaire quand le deploy_path
          d'une autre app est un sous-dossier de celui-ci (cas standard
          cPanel : un sous-domaine backend.example.com vit physiquement
          dans example.com/backend). Sans ça, --delete effacerait ce
          sous-dossier au déploiement de l'app parente.
        required: false
        type: string
        default: ""
    secrets:
      SSH_HOST:
        required: true
      SSH_PORT:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    # Deux déploiements simultanés vers le même deploy_path (ex. un push et
    # un workflow_dispatch qui se chevauchent) pourraient interleaver leurs
    # rsync/artisan sur le serveur. Un déploiement en attend un autre plutôt
    # que de les annuler (cancel-in-progress: false) pour ne jamais couper
    # un rsync en plein milieu.
    concurrency:
      group: deploy-${{ inputs.deploy_path }}
      cancel-in-progress: false
    steps:
      - name: Checkout du projet appelant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app

      # Le kit est récupéré À LA VERSION EXACTE du workflow appelé (contexte
      # job.workflow_sha) : workflow, scripts et actions restent cohérents.
      - name: Checkout xsel-deploy-mutualise (même version que ce workflow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: deploy-kit

      - name: Déployer
        uses: ./deploy-kit/.github/actions/deploy-app
        with:
          stack: ${{ inputs.stack }}
          app_path: ${{ inputs.app_path }}
          deploy_path: ${{ inputs.deploy_path }}
          health_check_url: ${{ inputs.health_check_url }}
          php_version: ${{ inputs.php_version }}
          php_bin: ${{ inputs.php_bin }}
          node_version: ${{ inputs.node_version }}
          build_frontend_assets: ${{ inputs.build_frontend_assets }}
          composer_on_server: ${{ inputs.composer_on_server }}
          composer_bin: ${{ inputs.composer_bin }}
          php_extensions: ${{ inputs.php_extensions }}
          manage_web_php: ${{ inputs.manage_web_php }}
          build_env: ${{ inputs.build_env }}
          protect_paths: ${{ inputs.protect_paths }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_port: ${{ secrets.SSH_PORT }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
