name: Doctor (diagnostic serveur)

# Workflow réutilisable, à lancer à la main (workflow_dispatch côté projet) : il
# ne déploie rien. Il interroge le serveur et répond aux questions qui coûtent
# des heures quand on les découvre en déploiement : SSH joignable ? quel PHP
# (CLI et web) ? extensions manquantes ? composer ? .env, APP_DEBUG, sauvegardes ?
# Il termine par le bloc `with:` prêt à coller dans le workflow de déploiement.
# Voir templates/doctor-caller.example.yml et ADR-0009.

on:
  workflow_call:
    inputs:
      stack:
        description: "'auto' (défaut), 'laravel' ou 'nextjs-passenger'"
        required: false
        type: string
        default: "auto"
      app_path:
        description: "Sous-dossier du repo appelant contenant l'app (ex. 'backend')"
        required: false
        type: string
        default: "."
      deploy_path:
        description: "Chemin absolu sur le serveur où l'app est (ou sera) déployée"
        required: true
        type: string
      health_check_url:
        description: "URL publique de l'app (active les diagnostics web et le suivi du PHP cPanel du domaine)"
        required: false
        type: string
        default: ""
      php_version:
        description: "Stack laravel — version PHP à tester (vide = déduite)"
        required: false
        type: string
        default: ""
      php_bin:
        description: "Stack laravel — binaire PHP imposé (auto = déduit)"
        required: false
        type: string
        default: "auto"
      php_extensions:
        description: "Stack laravel — extensions PHP supplémentaires à exiger, séparées par des virgules"
        required: false
        type: string
        default: ""
    secrets:
      SSH_HOST:
        required: true
      SSH_PORT:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  doctor:
    name: Diagnostic serveur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du projet appelant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app

      - name: Checkout xsel-deploy-mutualise (même version que ce workflow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: deploy-kit

      - name: Détecter stack, PHP, extensions, Node
        id: detect
        env:
          STACK_INPUT: ${{ inputs.stack }}
          EXTRA_EXTS: ${{ inputs.php_extensions }}
        run: |
          OUT="$(bash deploy-kit/scripts/detect-app.sh "app/${{ inputs.app_path }}")" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -E '^(stack|min_php|required_exts|node_version)=' >> "$GITHUB_OUTPUT"

      - name: Configurer SSH (connexion partagée)
        uses: ./deploy-kit/.github/actions/ssh-setup
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Domaine servi
        if: steps.detect.outputs.stack == 'laravel'
        env:
          HEALTH_URL: ${{ inputs.health_check_url }}
        run: |
          DOMAIN="${HEALTH_URL#*://}"
          echo "WEB_DOMAIN=${DOMAIN%%[/:?]*}" >> "$GITHUB_ENV"

      - name: Résoudre le PHP du serveur
        if: steps.detect.outputs.stack == 'laravel'
        uses: ./deploy-kit/.github/actions/resolve-php
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          user: ${{ secrets.SSH_USER }}
          php_bin: ${{ inputs.php_bin }}
          php_version: ${{ inputs.php_version }}
          min_php: ${{ steps.detect.outputs.min_php }}
          domain: ${{ env.WEB_DOMAIN }}

      - name: Rapport de diagnostic
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          STACK: ${{ steps.detect.outputs.stack }}
          REQUIRED_EXTS: ${{ steps.detect.outputs.required_exts }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          HEALTH_URL: ${{ inputs.health_check_url }}
          APP_PATH: ${{ inputs.app_path }}
        run: |
          rssh() { ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "$@"; }
          PHP="${RESOLVED_PHP_BIN:-}"
          {
            echo "## Diagnostic serveur — \`$DEPLOY_PATH\`"
            echo
            echo '```'
            echo "stack détecté : $STACK"
            if [ "$STACK" = "laravel" ]; then
              echo "PHP retenu : ${RESOLVED_PHP_BIN} (${RESOLVED_PHP_VERSION})"
              echo "extensions exigées (composer.lock) : ${REQUIRED_EXTS:-aucune}"
              echo
              echo "── Extensions PHP (diagnostic) ──"
              rssh "PHP_BIN='$PHP' REQUIRED_EXTS='$REQUIRED_EXTS' CHECK_ONLY=1 bash -s" < deploy-kit/scripts/ensure-php-extensions.sh
              if [ -n "$WEB_DOMAIN" ]; then
                echo
                echo "── PHP web (diagnostic) ──"
                rssh "PHP_BIN='$PHP' DOMAIN='$WEB_DOMAIN' CHECK_ONLY=1 bash -s" < deploy-kit/scripts/ensure-web-php.sh
              fi
            fi
            cat deploy-kit/scripts/lib/common.sh deploy-kit/scripts/doctor.sh \
              | rssh "PHP_BIN='$PHP' DEPLOY_PATH='$DEPLOY_PATH' HEALTH_URL='$HEALTH_URL' STACK='$STACK' bash -s"
            echo '```'
            echo
            echo "### Configuration suggérée (workflow de déploiement)"
            echo
            echo '```yaml'
            echo "with:"
            [ "$APP_PATH" != "." ] && echo "  app_path: $APP_PATH"
            echo "  deploy_path: $DEPLOY_PATH"
            [ -n "$HEALTH_URL" ] && echo "  health_check_url: $HEALTH_URL"
            [ "$STACK" = "laravel" ] && echo "# stack, php_version, php_bin, extensions : détectés automatiquement (PHP ${RESOLVED_PHP_VERSION} — ${RESOLVED_PHP_BIN})"
            [ "$STACK" = "nextjs-passenger" ] && echo "# stack et version de Node : détectés automatiquement"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
